services:
  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: conet-bot
    restart: unless-stopped
    dns:                      # 👈 forzar DNS de Google
      - 8.8.8.8
      - 8.8.4.4
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - API_BASE=${API_BASE}
      - USUARIOS_PERMITIDOS=${USUARIOS_PERMITIDOS}
    volumes:
      - ./usuarios.json:/app/usuarios.json